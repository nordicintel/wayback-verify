[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nordicintel-python-template"
version = "0.1.0"
description = "A shared Python foundation for NordicIntel projects."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.urls]
Repository = "https://github.com/nordicintel/python-template"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/template_package"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
